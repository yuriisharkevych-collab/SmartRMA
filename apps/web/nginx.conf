# Etap 7 — serwer statyczny dla builda produkcyjnego (`vite build`).
# Fallback SPA: `react-router` obsługuje trasy typu `/cases/123` po stronie
# klienta — bez `try_files ... /index.html` odświeżenie takiej strony
# dałoby 404 z nginx, zamiast wczytać aplikację i pozwolić routerowi
# rozstrzygnąć trasę.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Zasoby z hashem w nazwie (Vite: `assets/index-abc123.js`) są
    # niezmienne — bezpieczne długie cache. `index.html` NIGDY nie jest
    # cache'owany, żeby nowy deploy był widoczny natychmiast, nie dopiero
    # po wygaśnięciu cache przeglądarki.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;
}

<!doctype html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reklamacje — SmartRMA AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="cases">
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>

      <div class="content">
        <div class="page-header">
          <div>
            <h1>Reklamacje</h1>
            <p class="page-subtitle" id="subtitle">Wszystkie sprawy reklamacyjne w systemie.</p>
          </div>
          <a href="case-new.html" class="btn btn-primary" data-write-action>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
            Nowa reklamacja
          </a>
        </div>

        <div class="card">
          <div class="table-toolbar">
            <div class="filter-tabs" id="filter-tabs"></div>
            <div class="search-input">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
              <input type="text" id="table-search" placeholder="Nr sprawy, klient, produkt, numer seryjny…" />
            </div>
          </div>
          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Nr sprawy</th>
                  <th>Klient</th>
                  <th>Produkt</th>
                  <th>Producent</th>
                  <th>Typ</th>
                  <th>Status</th>
                  <th>Właściciel</th>
                  <th>Utworzono</th>
                </tr>
              </thead>
              <tbody id="cases-tbody"></tbody>
            </table>
          </div>
          <div id="empty-wrap"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="js/data.js"></script>
  <script src="js/client-labels.js"></script>
  <script src="js/app.js"></script>
  <script src="js/cases.js"></script>
</body>
</html>
